name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_career_user
          POSTGRES_PASSWORD: ai_career_password
          POSTGRES_DB: ai_career_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ai_career_user -d ai_career_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://ai_career_user:ai_career_password@localhost:5432/ai_career_test_db
      TEST_DATABASE_URL: postgresql+asyncpg://ai_career_user:ai_career_password@localhost:5432/ai_career_test_db
      SECRET_KEY: test-secret-key-for-ci
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      OPENAI_API_KEY: test-openai-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v